<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — ReadyID</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="brand">Ready<span>ID</span></div>
</div>

<div class="wrap" style="max-width:420px;">
  <div style="text-align:center; margin-bottom:28px;">
    <h1 style="font-size:1.5rem;">Set a new password</h1>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <div id="errorBox" class="error-msg" style="display:none;"></div>

    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
      <p class="hint">Use a password that's unique to ReadyID — avoid reusing one from another site.</p>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter your new password" autocomplete="new-password">
    </div>

    <button class="btn btn-primary btn-full" id="savePasswordBtn">Save new password</button>
  </div>

  <div class="card" id="waitingCard">
    <p style="margin:0; color:var(--text-muted);">Checking your reset link...</p>
  </div>

  <div class="card" id="invalidCard" style="display:none;">
    <p style="margin:0 0 12px;">This reset link is invalid or has expired. Request a new one below.</p>
    <a class="btn btn-outline btn-full" href="forgot-password.html">Request a new link</a>
  </div>

  <div class="card" id="doneCard" style="display:none;">
    <p style="margin:0 0 12px;">Your password has been updated.</p>
    <a class="btn btn-primary btn-full" href="index.html">Sign in</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
