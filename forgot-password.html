<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — ReadyID</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="brand">Ready<span>ID</span></div>
</div>

<div class="wrap" style="max-width:420px;">
  <div style="text-align:center; margin-bottom:28px;">
    <h1 style="font-size:1.5rem;">Reset your password</h1>
    <p style="color:var(--text-muted); margin-top:8px;">
      Enter the email you sign in with and we'll send you a link to set a new password.
    </p>
  </div>

  <div class="card" id="formCard">
    <div id="errorBox" class="error-msg" style="display:none;"></div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <button class="btn btn-primary btn-full" id="sendLinkBtn">Send reset link</button>
  </div>

  <div class="card" id="sentCard" style="display:none;">
    <p style="margin:0;">If an account exists for that email, we've sent a link to reset your password. It should arrive within a few minutes — check your spam folder if you don't see it.</p>
  </div>

  <p class="hint" style="text-align:center;">
    <a href="index.html">← Back to sign in</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
