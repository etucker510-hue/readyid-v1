<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — ReadyID</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="brand">Ready<span>ID</span></div>
  <button id="signOutBtn">Sign out</button>
</div>

<div class="wrap">

  <!-- Dashboard home -->
  <div id="homeView">

    <div class="dash-intro">
      <h1 class="dash-title">ReadyID Dashboard</h1>
      <p class="dash-subtitle">Manage your drivers and their emergency links.</p>
    </div>

    <!-- Summary cards -->
    <div class="dash-stats">
      <div class="stat-card">
        <div class="stat-value" id="statTotalDrivers">—</div>
        <div class="stat-label">Total Drivers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statActiveDrivers">—</div>
        <div class="stat-label">Active Drivers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statActiveLinks">—</div>
        <div class="stat-label">Emergency Links Active</div>
      </div>
    </div>

    <!-- Primary dashboard actions -->
    <div class="dash-actions">
      <button class="btn btn-primary dash-action" id="dashAddDriverBtn">+ Add Driver</button>
      <button class="btn btn-outline dash-action" id="dashViewDriversBtn">View Your Drivers</button>
      <button class="btn btn-outline dash-action" id="dashActivityBtn">Activity Log</button>
      <button class="btn btn-outline dash-action" id="dashProfileBtn">Your Profile</button>
    </div>

  </div>

  <!-- Activity log view (all drivers) -->
  <div id="logView" style="display:none;">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <button class="btn btn-outline" id="backFromLogBtn">← Back</button>
      <h1 style="font-size:1.3rem;">Activity Log — All Drivers</h1>
    </div>
    <div class="card" id="logListCard"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
